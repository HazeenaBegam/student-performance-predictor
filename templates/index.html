<!DOCTYPE html>
<html>
<head>
<title>Student Performance Predictor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h2>Student Performance Predictor</h2>

<form action="/predict" method="post">

<input type="number" name="study" placeholder="Study Hours" required>

<input type="number" name="social" placeholder="Social Media Hours" required>

<input type="number" name="sleep" placeholder="Sleep Hours" required>

<input type="number" name="attendance" placeholder="Attendance %" required>

<input type="number" name="assignment" placeholder="Assignment Score" required>

<button type="submit">Predict</button>

</form>

{% if prediction %}
<h3>Predicted Final Grade: {{prediction}}</h3>
{% endif %}

</div>

</body>
</html>
